name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Android SDK ships preinstalled on ubuntu-latest GitHub runners
      # (ANDROID_HOME is already set), so no manual SDK setup step here.
      #
      # verifyRoborazziDebug (bead vn-edu.34, made hermetic in vn-edu.40)
      # re-renders the 6 key-screen goldens under app/src/test/screenshot/goldens/
      # and fails the build on any pixel diff -- folded into the same step as
      # `test` since both are JVM-only, no emulator/device needed.
      - name: Unit tests + screenshot verification
        run: ./gradlew test verifyRoborazziDebug --stacktrace

  # TEMPORARY (asn-r60): records Roborazzi goldens on Linux CI and uploads
  # them as a build artifact, same throwaway-PR approach README's Roborazzi
  # section describes (precedent: asn-638). Gated to this one branch so it
  # doesn't run on anyone else's concurrent PR; reverted in a follow-up
  # commit before this branch lands on main.
  record-goldens:
    if: github.head_ref == 'agent/asn-r60'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Record Roborazzi goldens
        run: ./gradlew recordRoborazziDebug --stacktrace

      - name: Upload recorded goldens
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-goldens-asn-r60
          path: app/src/test/screenshot/goldens/

      # integrationTest (AssemblyAiLiveStreamingTest) hits the real AssemblyAI
      # streaming endpoint (~$0.01/run) and needs ASSEMBLYAI_API_KEY, so it is
      # intentionally excluded from the default job above. To wire it up as a
      # separate, opt-in job once a secret is added (Settings -> Secrets and
      # variables -> Actions -> New repository secret -> ASSEMBLYAI_API_KEY):
      #
      # integration-test:
      #   runs-on: ubuntu-latest
      #   steps:
      #     - uses: actions/checkout@v5
      #     - uses: actions/setup-java@v5
      #       with:
      #         distribution: temurin
      #         java-version: "21"
      #         cache: gradle
      #     - name: Integration test
      #       env:
      #         ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
      #       run: ./gradlew integrationTest --stacktrace
