name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Android SDK ships preinstalled on ubuntu-latest GitHub runners
      # (ANDROID_HOME is already set), so no manual SDK setup step here.
      #
      # verifyRoborazziDebug (bead vn-edu.34, made hermetic in vn-edu.40)
      # re-renders the 5 key-screen goldens under app/src/test/screenshot/goldens/
      # and fails the build on any pixel diff -- folded into the same step as
      # `test` since both are JVM-only, no emulator/device needed.
      - name: Unit tests + screenshot verification
        run: ./gradlew test verifyRoborazziDebug --stacktrace

      # SCRATCH STEP (asn-3sm, not for merge): DuckScreenshotTest's goldens
      # don't exist yet, so the verify step above only exercises the
      # existing 5 goldens. Record the new duck goldens here on this Linux
      # runner and upload them so they can be downloaded and committed as
      # the real (Linux-rendered) goldens -- see README's "Screenshot tests
      # (Roborazzi)" section on why goldens can't be recorded locally on
      # macOS. This step and its upload-artifact step are reverted before
      # this branch lands.
      - name: "[asn-3sm scratch] record duck goldens"
        run: ./gradlew recordRoborazziDebug --tests "com.montauk.voicecapture.screenshot.DuckScreenshotTest" --stacktrace

      - name: "[asn-3sm scratch] upload duck goldens"
        uses: actions/upload-artifact@v4
        with:
          name: duck-goldens
          path: app/src/test/screenshot/goldens/duck_*.png

      # integrationTest (AssemblyAiLiveStreamingTest) hits the real AssemblyAI
      # streaming endpoint (~$0.01/run) and needs ASSEMBLYAI_API_KEY, so it is
      # intentionally excluded from the default job above. To wire it up as a
      # separate, opt-in job once a secret is added (Settings -> Secrets and
      # variables -> Actions -> New repository secret -> ASSEMBLYAI_API_KEY):
      #
      # integration-test:
      #   runs-on: ubuntu-latest
      #   steps:
      #     - uses: actions/checkout@v5
      #     - uses: actions/setup-java@v5
      #       with:
      #         distribution: temurin
      #         java-version: "21"
      #         cache: gradle
      #     - name: Integration test
      #       env:
      #         ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
      #       run: ./gradlew integrationTest --stacktrace
